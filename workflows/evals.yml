name: Evals Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**'
      - 'pipelines/**'
      - 'core/**'

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run benchmark test cases
      run: |
        python scripts/run_evals.py

    - name: Run blind judge simulation
      run: |
        python scripts/judge.py
